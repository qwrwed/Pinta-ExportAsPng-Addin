name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          path: PintaExportAsPngAddin

      - name: Checkout Pinta
        uses: actions/checkout@v4
        with:
          repository: PintaProject/Pinta
          path: Pinta

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        working-directory: PintaExportAsPngAddin
        run: dotnet build -c Release

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: PintaExportAsPngAddin/bin/Release/net10.0/ExportAsPng.dll
